<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Chat TEST</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUacZx9uUYJnzcZ6X0crzTpIGooAdeVrY",
            authDomain: "neon-chat-3e879.firebaseapp.com",
            projectId: "neon-chat-3e879",
            storageBucket: "neon-chat-3e879.firebasestorage.app",
            messagingSenderId: "992796174231",
            appId: "1:992796174231:web:5a6248fc6258164a96c6d2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Делаем функцию глобальной
        window.testSend = async function(text) {
            try {
                await addDoc(collection(db, "messages"), {
                    text: text,
                    sender: "me"
                });
                alert("УРА! Сообщение долетело до Firebase!");
            } catch (e) {
                alert("ОШИБКА: " + e.message);
            }
        };
    </script>

    <style>
        body { background: #0f0f13; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; border-radius: 10px; border: none; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 10px; border: none; background: #6c5ce7; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Тест Firebase</h2>
    <br>
    <input type="text" id="msg" placeholder="Введи текст">
    <br>
    <button onclick="window.testSend(document.getElementById('msg').value)">Отправить в базу</button>
</body>
</html>
