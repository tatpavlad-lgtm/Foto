<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Chat</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUacZx9uUYJnzcZ6X0crzTpIGooAdeVrY",
            authDomain: "neon-chat-3e879.firebaseapp.com",
            projectId: "neon-chat-3e879",
            storageBucket: "neon-chat-3e879.firebasestorage.app",
            messagingSenderId: "992796174231",
            appId: "1:992796174231:web:5a6248fc6258164a96c6d2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messagesCollection = collection(db, "messages");

        // Когда страница загрузится, начинаем слушать базу
        window.onload = function() {
            const messagesEl = document.getElementById('messages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');

            // 1. Слушаем базу и рисуем сообщения
            onSnapshot(messagesCollection, (snapshot) => {
                messagesEl.innerHTML = ''; // Очищаем экран
                if (snapshot.empty) {
                    messagesEl.innerHTML = '<div style="color:#8888a0; text-align:center; margin-top:20px;">Напиши первое сообщение...</div>';
                    return;
                }
                snapshot.forEach((doc) => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.textContent = doc.data().text;
                    messagesEl.appendChild(div);
                });
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }, (error) => {
                alert("Ошибка чтения базы: " + error.message);
            });

            // 2. Отправка при клике
            sendBtn.addEventListener('click', async () => {
                const text = messageInput.value.trim();
                if (!text) return;
                
                try {
                    await addDoc(messagesCollection, {
                        text: text,
                        sender: "me"
                    });
                    messageInput.value = ''; // Очищаем поле только если отправка прошла успешно
                } catch (e) {
                    alert("Ошибка отправки: " + e.message);
                }
            });
        };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0f0f13; color: white; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a1a22; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #2a2a38; }
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #6c5ce7; padding: 10px 15px; border-radius: 16px; align-self: flex-end; max-width: 80%; font-size: 15px; word-wrap: break-word; }
        .input-area { padding: 15px; background: #1a1a22; display: flex; gap: 10px; }
        textarea { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #252530; color: white; resize: none; outline: none; font-family: inherit; }
        button { padding: 12px 20px; border: none; border-radius: 20px; background: #6c5ce7; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">Neon Chat</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <textarea id="messageInput" placeholder="Текст..." rows="1"></textarea>
        <button id="sendBtn">Отправить</button>
    </div>
</body>
</html>
