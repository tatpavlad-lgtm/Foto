<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Chat</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUacZx9uUYJnzcZ6X0crzTpIGooAdeVrY",
            authDomain: "neon-chat-3e879.firebaseapp.com",
            projectId: "neon-chat-3e879",
            storageBucket: "neon-chat-3e879.firebasestorage.app",
            messagingSenderId: "992796174231",
            appId: "1:992796174231:web:5a6248fc6258164a96c6d2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messagesCollection = collection(db, "messages");

        // Генерируем уникальный ID для этого устройства
        let myId = localStorage.getItem('myChatId');
        if (!myId) {
            myId = "user_" + Math.floor(Math.random() * 1000000);
            localStorage.setItem('myChatId', myId);
        }

        // Просим разрешение на уведомления
        if ("Notification" in window) {
            Notification.requestPermission();
        }

        window.onload = function() {
            const messagesEl = document.getElementById('messages');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            let isFirstLoad = true; // Чтобы не уведомлять о старых сообщениях при загрузке

            // Слушаем базу в реальном времени (без перезагрузки!)
            const q = query(messagesCollection, orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                messagesEl.innerHTML = ''; 
                
                if (snapshot.empty) {
                    messagesEl.innerHTML = '<div style="color:#8888a0; text-align:center; margin-top:20px;">Напиши первое сообщение...</div>';
                } else {
                    snapshot.forEach((doc) => {
                        const data = doc.data();
                        const div = document.createElement('div');
                        div.className = (data.senderId === myId) ? 'message mine' : 'message theirs';
                        div.textContent = data.text;
                        messagesEl.appendChild(div);
                    });
                    
                    // Прокручиваем вниз
                    messagesEl.scrollTop = messagesEl.scrollHeight;

                    // Если это не первая загрузка, и последнее сообщение не от нас — показываем уведомление
                    if (!isFirstLoad) {
                        const lastDoc = snapshot.docs[snapshot.docs.length - 1];
                        if (lastDoc && lastDoc.data().senderId !== myId) {
                            // Всплывающее окно
                            if (Notification.permission === "granted") {
                                new Notification("Neon Chat", { body: "Новое сообщение: " + lastDoc.data().text });
                            }
                            // Звук (используем встроенный аудио-буфер, чтобы не искать файлы)
                            try {
                                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                                const oscillator = audioCtx.createOscillator();
                                oscillator.type = 'sine';
                                oscillator.frequency.value = 800;
                                oscillator.connect(audioCtx.destination);
                                oscillator.start();
                                oscillator.stop(audioCtx.currentTime + 0.1);
                            } catch(e) {}
                        }
                    }
                    isFirstLoad = false; 
                }
            });

            sendBtn.addEventListener('click', async () => {
                const text = messageInput.value.trim();
                if (!text) return;
                
                messageInput.value = '';
                
                try {
                    await addDoc(messagesCollection, { 
                        text: text, 
                        senderId: myId, 
                        createdAt: new Date() 
                    });
                } catch (e) {
                    alert("Ошибка отправки: " + e.message);
                }
            });
        };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; background: #0f0f13; color: white; font-family: sans-serif; }
        
        .app-container { display: flex; flex-direction: column; height: 100dvh; }
        .header { background: #1a1a22; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #2a2a38; flex-shrink: 0; }
        
        .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message { padding: 10px 15px; border-radius: 16px; max-width: 80%; font-size: 15px; word-wrap: break-word; }
        .message.mine { background: #6c5ce7; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.theirs { background: #2d2d3a; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .input-area { padding: 10px 15px; background: #1a1a22; display: flex; gap: 10px; flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        textarea { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #252530; color: white; resize: none; outline: none; font-family: inherit; font-size: 15px; }
        button { padding: 12px 20px; border: none; border-radius: 20px; background: #6c5ce7; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">Neon Chat</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <textarea id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
            <button id="sendBtn">Ввод</button>
        </div>
    </div>
</body>
</html>
